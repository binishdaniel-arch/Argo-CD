deployment:
  replicas: 2
providers:
  kubernetesCRD:
    enabled: false
  kubernetesIngress:
    enabled: true
    nativeLBByDefault: true
    ingressEndpoint:
      ip: 127.0.0.1
    publishedService:
      enabled: false
  kubernetesGateway:
    enabled: false
service:
  type: ClusterIP
ingressClass:
  name: traefik
  isDefaultClass: false
additionalArguments:
  - "--accesslog=true"
