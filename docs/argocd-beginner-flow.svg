<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 450" role="img"><title>Beginner Argo CD automatic deployment loop</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6" fill="none" stroke="#287b7b"/></marker></defs><style>text{font:17px system-ui;fill:#203a42}.b{fill:#fff;stroke:#96bdb4;stroke-width:2}.l{fill:none;stroke:#287b7b;stroke-width:2;marker-end:url(#a)}</style><rect width="1080" height="450" rx="20" fill="#eef6f0"/><text x="25" y="38">ONE DEMO • a Git change causes automatic deployment</text><rect class="b" x="25" y="75" width="260" height="100" rx="12"/><text x="43" y="108">Git repository / main</text><text x="43" y="137">Deployment: replicas 2 → 3</text><text x="43" y="161">Service + pod label v1 → v2</text><path class="l" d="M285 125 H355"/><rect class="b" x="360" y="75" width="305" height="100" rx="12"/><text x="378" y="107">Argo Application</text><text x="378" y="135">repoURL + branch + folder</text><text x="378" y="161">destination + auto-sync policy</text><path class="l" d="M665 125 H735"/><rect class="b" x="740" y="75" width="310" height="100" rx="12"/><text x="758" y="108">Argo CD controller</text><text x="758" y="137">compare → automatic sync</text><text x="758" y="161">watch live state + self-heal</text><path class="l" d="M895 175 V245 H675 V275"/><rect class="b" x="430" y="280" width="490" height="105" rx="12"/><text x="450" y="313">Kubernetes namespace: argocd-demo</text><text x="450" y="342">demo-nginx Service → Deployment → 2 / 3 pods</text><text x="450" y="370">UI resource tree shows the rollout and Git revision</text><path class="l" d="M430 330 H170 V190"/><text x="30" y="270">Watch in the Argo URL</text><text x="30" y="300">localhost:8090 on desktop</text><text x="30" y="330">generated URL on KillerCoda</text><text x="25" y="425">No manual workload apply or manual Sync is needed after the Git push.</text></svg>