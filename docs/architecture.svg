<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 610" role="img" aria-labelledby="title desc"><title id="title">Ingress lab traffic flow</title><desc id="desc">Local HTTP traffic enters one of two Traefik controller pods, follows one of three Ingress host rules to a ClusterIP Service and two ready application pods. Kubernetes API watches are configuration, not traffic.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6" fill="none" stroke="#287b7b"/></marker></defs><rect width="1050" height="610" rx="20" fill="#f0f8f5"/><style>text{font:16px system-ui;fill:#183d43}.box{fill:white;stroke:#95bcb4;stroke-width:2}.line{stroke:#287b7b;stroke-width:2;fill:none;marker-end:url(#a)}</style><text x="30" y="35" font-weight="bold">DATA PLANE • HTTP requests → host rule → Service → ready pod</text><rect class="box" x="30" y="65" width="260" height="65" rx="12"/><text x="48" y="93">Browser / curl on localhost</text><text x="48" y="116">Host: nginx.lab.test :8080</text><path class="line" d="M290 96 H360"/><rect class="box" x="365" y="65" width="300" height="65" rx="12"/><text x="383" y="93">port-forward → Traefik :80</text><text x="383" y="116">one controller pod per session</text><rect class="box" x="720" y="65" width="290" height="65" rx="12"/><text x="738" y="93">Traefik replica 1 + replica 2</text><text x="738" y="116">Deployment / ingress-system</text><path class="line" d="M515 130 V165 H180 V190"/><path class="line" d="M515 165 V190"/><path class="line" d="M515 165 H850 V190"/><rect class="box" x="30" y="195" width="310" height="70" rx="12"/><text x="48" y="223">Ingress: nginx.lab.test</text><text x="48" y="248">Prefix / • class: traefik</text><path class="line" d="M185 265 V305"/><rect class="box" x="30" y="310" width="310" height="60" rx="12"/><text x="48" y="345">Service: nginx:80 ClusterIP</text><path class="line" d="M185 370 V395 H100 V420"/><path class="line" d="M185 395 H270 V420"/><rect class="box" x="30" y="425" width="145" height="55" rx="12"/><rect class="box" x="195" y="425" width="145" height="55" rx="12"/><text x="48" y="458">Pod replica 1</text><text x="213" y="458">Pod replica 2</text><rect class="box" x="365" y="195" width="310" height="70" rx="12"/><text x="383" y="223">Ingress: prometheus.lab.test</text><text x="383" y="248">Prefix / • class: traefik</text><path class="line" d="M520 265 V305"/><rect class="box" x="365" y="310" width="310" height="60" rx="12"/><text x="383" y="345">Service: prometheus:9090 ClusterIP</text><path class="line" d="M520 370 V395 H435 V420"/><path class="line" d="M520 395 H605 V420"/><rect class="box" x="365" y="425" width="145" height="55" rx="12"/><rect class="box" x="530" y="425" width="145" height="55" rx="12"/><text x="383" y="458">Pod replica 1</text><text x="548" y="458">Pod replica 2</text><rect class="box" x="700" y="195" width="310" height="70" rx="12"/><text x="718" y="223">Ingress: grafana.lab.test</text><text x="718" y="248">Prefix / • class: traefik</text><path class="line" d="M855 265 V305"/><rect class="box" x="700" y="310" width="310" height="60" rx="12"/><text x="718" y="345">Service: grafana:3000 ClusterIP</text><path class="line" d="M855 370 V395 H770 V420"/><path class="line" d="M855 395 H940 V420"/><rect class="box" x="700" y="425" width="145" height="55" rx="12"/><rect class="box" x="865" y="425" width="145" height="55" rx="12"/><text x="718" y="458">Pod replica 1</text><text x="883" y="458">Pod replica 2</text><text x="30" y="525">CONFIGURATION PLANE • API: Ingress + IngressClass + Services + EndpointSlices → controller watches</text><text x="30" y="555">nativeLBByDefault=true makes Traefik use Service ClusterIPs in this lab.</text><text x="30" y="582">Grafana → prometheus:9090 uses internal DNS. Replica count alone does not guarantee node-level HA.</text></svg>