<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 750" role="img"><title>Argo CD components and internal Services</title><desc>The browser and CLI reach argocd-server. The application-controller requests desired manifests from repo-server, which reads Git. The controller watches and updates the Kubernetes API; Kubernetes runs application pods. Redis is a supporting cache. ApplicationSet creates Application objects. Dex and notifications are optional and disabled.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6" fill="none" stroke="#287b7b"/></marker></defs><style>text{font:16px system-ui;fill:#203a42}.b{fill:#fff;stroke:#96bdb4;stroke-width:2}.l{fill:none;stroke:#287b7b;stroke-width:2;marker-end:url(#a)}.support{fill:none;stroke:#a67b43;stroke-width:2;stroke-dasharray:6 5}.optional{fill:#fff5e4;stroke:#c9aa76;stroke-width:2}</style><rect width="1100" height="750" rx="20" fill="#eef6f0"/><text x="25" y="35">ARGO CD COMPONENTS • solid arrows show requests / updates; dashed lines show cache support</text><rect class="b" x="25" y="65" width="300" height="80" rx="12"/><text x="42" y="96">Browser / CLI</text><text x="42" y="125">localhost:8090 or playground URL</text><path class="l" d="M325 105 H385"/><rect class="b" x="390" y="65" width="320" height="80" rx="12"/><text x="408" y="96">argocd-server Service :80</text><text x="408" y="125">server pod :8080 • UI / API / auth</text><path class="l" d="M710 105 H780"/><rect class="b" x="785" y="65" width="285" height="80" rx="12"/><text x="802" y="96">Kubernetes API</text><text x="802" y="125">Application CR + live resources</text><rect class="b" x="25" y="225" width="260" height="85" rx="12"/><text x="42" y="256">Git repository</text><text x="42" y="285">main / desired YAML or Helm</text><path class="l" d="M335 267 H290"/><rect class="b" x="340" y="225" width="300" height="85" rx="12"/><text x="357" y="256">repo-server Service :8081</text><text x="357" y="285">Fetch Git + generate manifests</text><path class="l" d="M700 267 H645"/><text x="640" y="330">request / return desired manifests</text><rect class="b" x="705" y="225" width="365" height="85" rx="12"/><text x="722" y="255">application-controller StatefulSet</text><text x="722" y="283">Compare → sync → health • no Service</text><path class="l" d="M927 225 V150"/><text x="940" y="190">watch / apply</text><rect class="b" x="340" y="390" width="300" height="80" rx="12"/><text x="357" y="422">Redis Service :6379</text><text x="357" y="451">Shared cache, not Git storage</text><path class="support" d="M490 310 V390"/><path class="support" d="M550 145 V185 H665 V430 H640"/><path class="support" d="M705 285 H680 V430 H640"/><rect class="b" x="705" y="390" width="365" height="100" rx="12"/><text x="722" y="421">Kubernetes runs the workload</text><text x="722" y="450">Deployment → ReplicaSet → Pods</text><text x="722" y="478">demo-nginx Service → 2 / 3 pods</text><path class="l" d="M1070 125 H1085 V435 H1075"/><rect class="optional" x="25" y="540" width="510" height="95" rx="12"/><text x="42" y="570">ApplicationSet controller • installed, unused here</text><text x="42" y="598">Generates Application objects, not workload pods</text><text x="42" y="623">Service :7000 is its webhook receiver</text><rect class="optional" x="570" y="540" width="500" height="95" rx="12"/><text x="587" y="571">Disabled in this lab</text><text x="587" y="599">Dex: optional SSO identity broker</text><text x="587" y="623">Notifications: optional event messages</text><text x="25" y="684">The API server shows status; repo-server reads Git; application-controller reconciles.</text><text x="25" y="718">Argo manages configuration. NGINX application traffic does not pass through these Argo components.</text></svg>