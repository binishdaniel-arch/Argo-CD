<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 610" role="img"><title>KillerCoda browser traffic through Traefik</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6" fill="none" stroke="#287b7b"/></marker></defs><style>text{font:16px system-ui;fill:#203a42}.b{fill:#fff;stroke:#96bdb4;stroke-width:2}.l{fill:none;stroke:#287b7b;stroke-width:2;marker-end:url(#a)}</style><rect width="1080" height="610" rx="20" fill="#eff7f2"/><text x="25" y="35">KILLERCODA ? generated browser hosts preserve the ingress traffic flow</text><rect class="b" x="25" y="65" width="285" height="90" rx="12"/><text x="42" y="98">Browser: generated platform URL</text><text x="42" y="130">Host header = session hostname</text><path class="l" d="M310 110 H365"/><rect class="b" x="370" y="65" width="300" height="90" rx="12"/><text x="387" y="98">KillerCoda Traffic / Ports proxy</text><text x="387" y="130">8080 / 8081 / 8082 / 8083</text><path class="l" d="M670 110 H725"/><rect class="b" x="730" y="65" width="320" height="90" rx="12"/><text x="747" y="98">4 forwards ? Traefik Service :80</text><text x="747" y="130">remote VM address: 0.0.0.0</text><path class="l" d="M890 155 V190 H540 V220"/><rect class="b" x="355" y="225" width="370" height="70" rx="12"/><text x="375" y="253">Traefik controller: 2 replicas</text><text x="375" y="280">Host rules select application Services</text><path class="l" d="M540 295 V325 H140 V355"/><rect class="b" x="20" y="360" width="245" height="80" rx="12"/><text x="35" y="390">Generated host for 8080</text><text x="35" y="420">Ingress ? NGINX</text><path class="l" d="M140 440 V475"/><rect class="b" x="20" y="480" width="245" height="70" rx="12"/><text x="35" y="508">ClusterIP Service</text><text x="35" y="535">NGINX: 2 pods</text><path class="l" d="M540 295 V325 H405 V355"/><rect class="b" x="285" y="360" width="245" height="80" rx="12"/><text x="300" y="390">Generated host for 8081</text><text x="300" y="420">Ingress ? Prometheus</text><path class="l" d="M405 440 V475"/><rect class="b" x="285" y="480" width="245" height="70" rx="12"/><text x="300" y="508">ClusterIP Service</text><text x="300" y="535">Prometheus: 2 pods</text><path class="l" d="M540 295 V325 H670 V355"/><rect class="b" x="550" y="360" width="245" height="80" rx="12"/><text x="565" y="390">Generated host for 8082</text><text x="565" y="420">Ingress ? Grafana</text><path class="l" d="M670 440 V475"/><rect class="b" x="550" y="480" width="245" height="70" rx="12"/><text x="565" y="508">ClusterIP Service</text><text x="565" y="535">Grafana: 2 pods</text><path class="l" d="M540 295 V325 H935 V355"/><rect class="b" x="815" y="360" width="245" height="80" rx="12"/><text x="830" y="390">Generated host for 8083</text><text x="830" y="420">Ingress ? Argo CD</text><path class="l" d="M935 440 V475"/><rect class="b" x="815" y="480" width="245" height="70" rx="12"/><text x="830" y="508">ClusterIP Service</text><text x="830" y="535">Argo CD: 1 server pod</text><text x="25" y="588">Terminal curl can still use the original .lab.test Host rules on localhost:8080 inside the remote VM.</text></svg>