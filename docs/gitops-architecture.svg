<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 570" role="img"><title>GitOps reconciliation and ingress traffic</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6" fill="none" stroke="#287b7b"/></marker></defs><style>text{font:16px system-ui;fill:#203a42}.b{fill:white;stroke:#9abdb3;stroke-width:2}.l{fill:none;stroke:#287b7b;stroke-width:2;marker-end:url(#arrow)}</style><rect width="1080" height="570" fill="#eff7f2" rx="20"/><text x="25" y="35">CONTROL LOOP • desired state is pulled from Git; live state is watched from Kubernetes</text><rect class="b" x="25" y="70" width="220" height="85" rx="12"/><text x="40" y="101">Student: edit, test, commit</text><text x="40" y="130">git push → GitHub main</text><path class="l" d="M245 110 H290"/><rect class="b" x="295" y="70" width="220" height="85" rx="12"/><text x="310" y="101">Git repository</text><text x="310" y="130">charts/ + values.yaml</text><path class="l" d="M515 110 H560"/><rect class="b" x="565" y="70" width="245" height="85" rx="12"/><text x="580" y="101">Argo repo-server</text><text x="580" y="130">fetch + Helm rendering</text><path class="l" d="M690 155 V205"/><rect class="b" x="540" y="210" width="300" height="85" rx="12"/><text x="555" y="240">Application-controller</text><text x="555" y="268">compare → diff → sync → health</text><path class="l" d="M540 250 H340"/><rect class="b" x="25" y="210" width="310" height="85" rx="12"/><text x="40" y="240">Kubernetes API / ingress-lab</text><text x="40" y="268">Deployment + Service + Ingress</text><path class="l" d="M335 280 H500 V310 H690 V295"/><text x="350" y="338">watch live state; selfHeal repairs drift</text><text x="25" y="385">DATA PLANE • application traffic does not pass through the Argo CD control plane</text><rect class="b" x="25" y="415" width="205" height="70" rx="12"/><text x="40" y="443">Browser / curl entry URL</text><text x="40" y="468">Host: lab / generated</text><path class="l" d="M230 450 H275"/><rect class="b" x="280" y="415" width="180" height="70" rx="12"/><text x="295" y="445">Traefik controller</text><text x="295" y="470">Ingress host rules</text><path class="l" d="M460 450 H505"/><rect class="b" x="510" y="415" width="235" height="70" rx="12"/><text x="525" y="445">3 application Services</text><text x="525" y="470">NGINX / Prom / Grafana</text><path class="l" d="M745 450 H790"/><rect class="b" x="795" y="415" width="250" height="70" rx="12"/><text x="810" y="445">2 ready pods per app</text><text x="810" y="470">same workloads as Lab 1</text><text x="25" y="535">Argo UI: argocd.lab.test:8080 → Traefik → argocd-server Service → server pod (separate from apps)</text></svg>